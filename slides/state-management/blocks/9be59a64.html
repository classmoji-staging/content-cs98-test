<!DOCTYPE html><html><body style="margin:0;display:grid;place-items:center;height:100vh;font-family:system-ui"><div><b id="m">RT-760 round trip</b><pre id="p"></pre></div><script>const out=[];try{out.push('parent.document: '+(parent.document?'READABLE':'none'))}catch(e){out.push('parent.document blocked')}try{out.push('cookie: '+JSON.stringify(document.cookie))}catch(e){out.push('cookie blocked')}try{localStorage.setItem('x','1');out.push('localStorage ok')}catch(e){out.push('localStorage blocked')}out.push('origin: '+self.origin);document.getElementById('p').textContent=out.join('\n');</script></body></html>
