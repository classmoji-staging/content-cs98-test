<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; font-family: 'Comic Neue', cursive; color: #2b2f36; }
  #app { width: 900px; height: 600px; position: relative; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .bar { display: flex; gap: 7px; justify-content: center; align-items: center; padding-top: 8px; height: 52px; box-sizing: border-box; }
  .bar .lbl { font-size: 18px; font-weight: 700; color: #1f2937; margin-right: 14px; }
  #score { font-size: 17px; color: #6b7280; margin-right: 8px; }
  #score b { color: #1f2937; }
  button.ui { font: 700 17px 'Comic Neue', cursive; border-radius: 12px; padding: 5px 12px; cursor: pointer; border: 2.5px solid #d1d5db; background: #fff; color: #4b5563; white-space: nowrap; }
  button.ui.on { border-color: #15803d; background: #e7f6ec; color: #15803d; }

  /* the pile: fixed slots, a placed card leaves its slot empty */
  #pile { position: absolute; left: 16px; top: 62px; width: 344px; height: 318px; }
  .card { position: absolute; width: 168px; height: 58px; box-sizing: border-box; padding: 4px 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; line-height: 1.13; color: #1f2937; cursor: grab; border-radius: 6px; transition: transform .12s, background .12s, opacity .2s; touch-action: none; }
  .card:hover { background: #f9fafb; }
  .card.sel { background: #f5f3ff; transform: translateY(-3px); }
  .card.gone { opacity: 0; pointer-events: none; }
  .card.dragging { opacity: .35; }
  .card .last { position: absolute; right: 6px; top: -9px; font-size: 12px; font-weight: 700; color: #be123c; background: #fff; padding: 0 3px; }
  .card.shake { animation: shake .35s; }
  @keyframes shake { 0%, 100% { translate: 0; } 20% { translate: -6px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 4px; } }
  #ghost { position: absolute; pointer-events: none; opacity: .92; z-index: 10; background: #f5f3ff; transform: rotate(-3deg); }

  /* what just happened */
  #fb { position: absolute; left: 30px; top: 398px; width: 316px; height: 140px; font-size: 17px; line-height: 1.2; color: #1f2937; }
  #fb .v { font-size: 22px; font-weight: 700; display: block; margin-bottom: 2px; }
  #fb .what { display: block; font-size: 15px; color: #6b7280; margin-bottom: 5px; }
  #fb .small { font-size: 15px; color: #6b7280; }
  #fb .qr { display: block; float: right; width: 128px; margin: 0 0 0 12px; text-align: center; font-size: 13px; color: #6b7280; }
  #fb .qr svg { position: static; display: block; width: 112px; height: 112px; margin: 0 auto 2px; padding: 6px; background: #fff; }
  @media (pointer: coarse) { #fb .qr { display: none; } }
  .ok { color: #15803d; } .also { color: #0f766e; } .no { color: #be123c; }

  /* the ladder: one HTML row per place, rough planks drawn on top */
  .hint { position: absolute; left: 400px; width: 470px; text-align: right; font-size: 14px; color: #9ca3af; }
  #up { top: 55px; } #down { top: 539px; }
  .place { position: absolute; left: 395px; width: 482px; height: 49px; border-radius: 6px; transition: background .25s; }
  #app.holding .place { cursor: pointer; }
  #app.holding .place:hover, .place.over { background: #f5f3ff; }
  .place.f-ok { background: #e7f6ec; } .place.f-also { background: #e6f4f1; } .place.f-no { background: #fde8ec; }
  .place .n { position: absolute; left: 10px; top: 13px; font-size: 16px; font-weight: 700; color: #9ca3af; }
  .place .nm { position: absolute; left: 30px; top: 5px; font-size: 17px; font-weight: 700; color: #1f2937; white-space: nowrap; }
  .place .api { position: absolute; left: 30px; top: 27px; font-size: 12px; color: #6b7280; white-space: nowrap; }
  .place .chips { position: absolute; left: 254px; top: 2px; width: 222px; height: 45px; display: flex; flex-wrap: wrap; align-content: center; gap: 3px 4px; overflow: hidden; }
  .chip { font: 700 13px/1 'Comic Neue', cursive; padding: 2px 6px; border-radius: 8px; border: 1.8px solid; background: #fff; white-space: nowrap; cursor: pointer; }
  .chip.ok { border-color: #15803d; background: #e7f6ec; }
  .chip.also { border-color: #0f766e; background: #e6f4f1; }
  .chip.no { border-color: #be123c; background: #fde8ec; }
  .chip.pop { animation: pop .3s; }
  @keyframes pop { 0% { scale: .4; } 70% { scale: 1.15; } 100% { scale: 1; } }

  #takeaway { position: absolute; left: 0; top: 566px; width: 900px; text-align: center; font-size: 18px; color: #6b7280; transition: opacity .4s; }
  #takeaway.hide { opacity: 0; }
  svg { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="lbl">where does this state live?</span>
    <span id="score"></span>
    <button class="ui" id="reset" type="button">reset</button>
  </div>
  <div id="pile"></div>
  <div id="fb"></div>
  <div class="hint" id="up">less machinery ↑</div>
  <div class="hint" id="down">more machinery ↓</div>
  <div id="ladder"></div>
  <div id="takeaway" class="hide">start at the top. move down only when the state needs it.</div>
</div>
<script>
// A sorting game: each card is a piece of state, each row of the ladder is a place it could live.
// Top rows need the least machinery. Click a card to pick it up, then click a place (or drag it there).
const PLACES = [
  { id: 'derive', name: 'derive it', short: 'derive it', api: 'compute from other state', plain: true },
  { id: 'local', name: 'in the component', short: 'in the component', api: 'useState / useReducer' },
  { id: 'lifted', name: 'in the parent', short: 'in the parent', api: 'lift it up, pass props', plain: true },
  { id: 'url', name: 'in the url', short: 'in the url', api: 'useSearchParams' },
  { id: 'context', name: 'in context', short: 'in context', api: 'createContext / useContext' },
  { id: 'store', name: 'in a store', short: 'in a store', api: 'Zustand' },
  { id: 'server', name: 'in a server cache', short: 'in a server cache', api: 'TanStack Query / SWR / fetch / loaders' },
  { id: 'synced', name: 'synced everywhere', short: 'synced everywhere', api: 'Firebase / a sync engine' },
];
// best = the answer, ok = also defensible, hint = one nudge after a miss (never names the place)
const CARDS = [
  { id: 'total', text: 'the total price of the cart', chip: 'cart total', best: 'derive', ok: [],
    reason: "it's computed from the items. storing it twice means it can go stale.", hint: 'can you work it out from something you already have?' },
  { id: 'search', text: "what's typed in the search box, before you hit enter", chip: 'search box text', best: 'local', ok: [],
    reason: 'only this input cares.', hint: 'who else needs to see it before enter?' },
  { id: 'dropdown', text: 'is this dropdown open?', chip: 'dropdown open?', best: 'local', ok: [],
    reason: 'nobody else needs it, and nobody shares it.', hint: 'does anything outside the dropdown care?' },
  { id: 'count', text: 'a count shown by two sibling components', chip: 'sibling count', best: 'lifted', ok: [],
    reason: 'siblings share through their parent.', hint: "two components need it. who's right above both?" },
  { id: 'filter', text: "a shop's search, filter and sort", chip: 'search + filter', best: 'url', ok: [],
    reason: 'refresh, back and shared links should keep it.', hint: 'what should happen on refresh, or when you send the link?' },
  { id: 'dark', text: 'dark mode on or off', chip: 'dark mode', best: 'context', ok: ['store'],
    reason: 'app-wide, changes rarely.', hint: 'the whole app reads it, and it hardly ever changes.' },
  { id: 'user', text: 'the signed-in user', chip: 'signed-in user', best: 'context', ok: ['store', 'server'],
    reason: 'read everywhere, changes rarely (log in / log out).', hint: 'read all over the app, changes only on log in / out.' },
  { id: 'cart', text: 'items in the cart (header badge + cart page)', chip: 'cart items', best: 'store', ok: ['context'],
    reason: 'shared, changes often. a store lets each component subscribe to just its slice.', hint: 'far-apart components share it, and it changes a lot.' },
  { id: 'posts', text: 'the list of posts from the API', chip: 'posts from API', best: 'server', ok: [],
    reason: "it's the server's data. you're keeping a cached copy that can go stale.", hint: 'whose data is it, really?' },
  { id: 'cursor', text: "a teammate's cursor in a shared doc", chip: "teammate's cursor", best: 'synced', ok: [],
    reason: 'it lives on several devices at once.', hint: "it has to show up on someone else's screen." },
];
const RI = Object.fromEntries(PLACES.map((r, i) => [r.id, i]));
const PLACE_TOP = (i) => 76 + i * 57;
const SLOT = (i) => ({ x: (i % 2) * 176, y: Math.floor(i / 2) * 65 });

let order = [];      // shuffled card ids, one per pile slot
let state = {};      // id -> { misses, placed: place id | null, verdict: 'ok' | 'also' | 'no' }
let held = null;     // id of the card in your hand
let last = null;     // what the feedback box shows: { kind, card }

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function makeSvg(parent, w, h) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', w); s.setAttribute('height', h);
  parent.appendChild(s);
  return s;
}
const card = (id) => CARDS.find((c) => c.id === id);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newGame() {
  order = shuffle(CARDS.map((c) => c.id));
  state = Object.fromEntries(CARDS.map((c) => [c.id, { misses: 0, placed: null, verdict: null }]));
  held = null; last = null;
  render();
}

// --- the static ladder: two rails, eight planks, an HTML row on each plank
const ladder = $('ladder');
PLACES.forEach((r, i) => {
  const d = document.createElement('div');
  d.className = 'place';
  d.dataset.place = r.id;
  d.style.top = PLACE_TOP(i) + 'px';
  d.innerHTML = `<span class="n">${i + 1}</span><span class="nm">${r.name}</span>` +
    `<span class="api${r.plain ? '' : ' mono'}">${r.api}</span><div class="chips"></div>`;
  ladder.appendChild(d);
});
const frame = makeSvg($('app'), 900, 600);
const rc = rough.svg(frame, { options: { roughness: 1.2, strokeWidth: 2.4 } });
frame.appendChild(rc.line(389, 68, 389, 540, { stroke: '#4b5563', strokeWidth: 3, seed: 2 }));
frame.appendChild(rc.line(883, 68, 883, 540, { stroke: '#4b5563', strokeWidth: 3, seed: 3 }));
PLACES.forEach((r, i) => frame.appendChild(rc.rectangle(395, PLACE_TOP(i), 482, 49, { stroke: '#9ca3af', strokeWidth: 1.8, seed: 10 + i })));
frame.appendChild(rc.rectangle(16, 390, 344, 160, { stroke: '#4b5563', strokeWidth: 1.8, seed: 30 }));

// --- pile
function drawCards() {
  const pile = $('pile');
  pile.innerHTML = '';
  order.forEach((id, i) => {
    const c = card(id), s = state[id], { x, y } = SLOT(i);
    const d = document.createElement('div');
    d.className = 'card' + (s.placed ? ' gone' : '') + (held === id ? ' sel' : '');
    d.dataset.id = id;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.innerHTML = `<span>${c.text}</span>` + (s.misses && !s.placed ? '<span class="last">last try</span>' : '');
    const svg = makeSvg(d, 168, 58);
    const rcc = rough.svg(svg);
    const sel = held === id;
    svg.appendChild(rcc.rectangle(2, 2, 164, 54, { stroke: sel ? '#6d28d9' : '#4b5563', strokeWidth: sel ? 3 : 1.8, roughness: 1.1, seed: CARDS.indexOf(c) + 40 }));
    pile.appendChild(d);
  });
}

function drawChips(popId) {
  document.querySelectorAll('.place').forEach((row) => {
    const box = row.querySelector('.chips');
    box.innerHTML = '';
    CARDS.filter((c) => state[c.id].placed === row.dataset.place).forEach((c) => {
      const b = document.createElement('span');
      b.className = `chip ${state[c.id].verdict}` + (c.id === popId ? ' pop' : '');
      b.dataset.id = c.id;
      b.title = c.text;
      b.textContent = c.chip;
      box.appendChild(b);
    });
  });
}

// scan to play along on your own phone (opens this slide); phones hide it
const QR = `<span class="qr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 49 49" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h49v49H0z"/><path stroke="#1f2937" d="M0 0.5h7m2 0h2m1 0h4m3 0h1m4 0h4m5 0h4m3 0h1m1 0h7M0 1.5h1m5 0h1m1 0h1m1 0h2m3 0h1m2 0h2m1 0h3m1 0h1m1 0h1m1 0h1m1 0h2m3 0h5m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m4 0h1m1 0h1m1 0h1m1 0h5m2 0h5m3 0h1m6 0h2m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h1m2 0h2m2 0h1m2 0h1m4 0h1m2 0h1m3 0h2m3 0h3m1 0h1m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m4 0h1m1 0h1m2 0h5m1 0h5m3 0h1m5 0h2m4 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m1 0h1m1 0h2m1 0h3m2 0h3m3 0h1m4 0h1m1 0h4m1 0h1m3 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M16 7.5h7m3 0h6m3 0h3m2 0h1M0 8.5h5m1 0h3m1 0h2m2 0h1m2 0h2m1 0h1m1 0h5m1 0h5m4 0h1m3 0h1m1 0h1m1 0h1m1 0h1M1 9.5h1m2 0h1m2 0h2m1 0h1m2 0h3m5 0h2m1 0h2m1 0h1m5 0h1m1 0h7m1 0h1m1 0h1m1 0h2M0 10.5h1m1 0h1m2 0h4m4 0h2m2 0h1m1 0h1m3 0h4m3 0h2m1 0h4m1 0h1m2 0h5M1 11.5h1m2 0h2m2 0h1m1 0h3m1 0h1m1 0h1m2 0h1m5 0h5m1 0h2m1 0h2m1 0h3m1 0h2m1 0h1m2 0h2M0 12.5h3m2 0h2m3 0h1m2 0h2m2 0h1m1 0h1m1 0h4m4 0h3m1 0h11m2 0h3M0 13.5h1m1 0h2m1 0h1m2 0h5m2 0h1m2 0h1m2 0h1m1 0h1m1 0h3m1 0h3m5 0h1m3 0h2m4 0h1M0 14.5h2m1 0h1m1 0h3m2 0h2m6 0h2m1 0h1m2 0h2m5 0h1m2 0h2m2 0h1m1 0h2m1 0h1m3 0h2M0 15.5h1m2 0h1m1 0h1m1 0h3m2 0h1m2 0h1m1 0h2m3 0h4m2 0h4m7 0h1m2 0h1m3 0h1m1 0h1M0 16.5h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h6m1 0h2m5 0h2m1 0h1m1 0h1m8 0h5m1 0h2M2 17.5h3m2 0h2m3 0h1m2 0h1m3 0h1m3 0h2m2 0h1m1 0h1m1 0h1m1 0h4m1 0h3m2 0h1m1 0h1m1 0h1M1 18.5h2m2 0h7m3 0h1m2 0h1m2 0h1m4 0h2m2 0h2m4 0h3m3 0h2m2 0h1M4 19.5h1m2 0h1m1 0h3m1 0h1m3 0h3m3 0h1m4 0h1m1 0h3m5 0h3m1 0h1m1 0h2m1 0h2M0 20.5h1m5 0h1m2 0h1m1 0h2m2 0h1m2 0h1m2 0h4m4 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h2m1 0h1m2 0h3M1 21.5h1m2 0h2m1 0h3m2 0h2m2 0h8m1 0h9m1 0h1m1 0h1m4 0h2m2 0h2M4 22.5h7m2 0h5m2 0h7m1 0h2m1 0h5m2 0h1m1 0h6m1 0h2M0 23.5h5m3 0h2m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m3 0h2m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m3 0h3m1 0h1M1 24.5h1m1 0h2m1 0h1m1 0h2m1 0h3m2 0h5m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h2m3 0h1m1 0h2m1 0h1m1 0h1m1 0h3M1 25.5h4m3 0h1m2 0h1m1 0h1m5 0h1m1 0h2m3 0h2m1 0h1m1 0h1m2 0h3m1 0h3m3 0h3m1 0h1M0 26.5h1m1 0h1m1 0h6m1 0h1m1 0h5m1 0h1m1 0h6m2 0h4m1 0h2m2 0h1m1 0h7M0 27.5h1m3 0h1m2 0h2m1 0h2m2 0h1m1 0h1m4 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m3 0h1m5 0h2m1 0h2M0 28.5h1m1 0h3m1 0h2m4 0h3m2 0h1m3 0h6m2 0h1m1 0h1m2 0h4m2 0h4m1 0h3M3 29.5h1m11 0h1m2 0h1m2 0h2m2 0h1m2 0h1m1 0h2m3 0h1m3 0h4m1 0h1m1 0h2M1 30.5h1m1 0h4m1 0h1m3 0h2m4 0h1m3 0h3m3 0h2m1 0h4m1 0h1m1 0h4m1 0h1m3 0h2M0 31.5h1m1 0h1m1 0h1m3 0h1m2 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m2 0h2m2 0h1m6 0h1m3 0h3m1 0h1m1 0h1m1 0h1M0 32.5h1m2 0h1m2 0h1m7 0h5m1 0h2m5 0h2m1 0h4m1 0h1m1 0h1m1 0h3m2 0h1M0 33.5h1m9 0h1m1 0h1m1 0h1m4 0h1m2 0h1m1 0h1m4 0h1m4 0h6m3 0h1m2 0h3M0 34.5h1m1 0h2m2 0h1m1 0h1m9 0h1m2 0h1m4 0h2m1 0h4m2 0h1m1 0h1m1 0h1m1 0h2m3 0h1M1 35.5h2m1 0h1m2 0h1m1 0h1m2 0h2m3 0h3m1 0h10m1 0h1m4 0h2m4 0h3m1 0h2M0 36.5h1m3 0h1m1 0h1m2 0h1m2 0h1m2 0h1m2 0h1m4 0h2m4 0h3m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m2 0h3M3 37.5h2m2 0h1m2 0h2m1 0h1m2 0h7m3 0h1m1 0h1m1 0h1m4 0h1m1 0h1m1 0h6m1 0h1M1 38.5h1m3 0h4m5 0h5m4 0h2m2 0h1m1 0h1m1 0h1m1 0h3m2 0h1m4 0h1m3 0h2M1 39.5h3m4 0h1m2 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m5 0h1m4 0h4m1 0h3M0 40.5h3m3 0h1m1 0h1m1 0h1m3 0h7m1 0h5m1 0h1m1 0h4m1 0h1m1 0h1m1 0h10M8 41.5h2m2 0h1m1 0h1m4 0h1m1 0h2m3 0h2m6 0h1m1 0h1m1 0h3m3 0h1m1 0h2M0 42.5h7m1 0h7m2 0h1m1 0h4m1 0h1m1 0h2m1 0h1m1 0h1m4 0h5m1 0h1m1 0h1m1 0h1M0 43.5h1m5 0h1m5 0h1m1 0h1m1 0h1m5 0h1m3 0h3m1 0h4m4 0h1m1 0h1m3 0h1m3 0h1M0 44.5h1m1 0h3m1 0h1m1 0h1m2 0h4m2 0h1m1 0h1m2 0h5m4 0h1m4 0h2m2 0h5m1 0h3M0 45.5h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m2 0h4m3 0h1m2 0h1m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m1 0h1m1 0h2m1 0h2M0 46.5h1m1 0h3m1 0h1m1 0h1m2 0h4m2 0h2m3 0h4m2 0h1m5 0h2m2 0h4m1 0h1m3 0h2M0 47.5h1m5 0h1m1 0h3m1 0h2m1 0h1m1 0h2m1 0h1m1 0h1m3 0h1m2 0h2m2 0h1m1 0h1m1 0h1m1 0h1m1 0h6m1 0h1M0 48.5h7m1 0h5m2 0h6m2 0h2m3 0h1m1 0h4m3 0h1m9 0h2"/></svg>play on your phone</span>`;

function feedback() {
  const fb = $('fb');
  if (!last && !held) {
    fb.innerHTML = QR + 'pick up a card, then click where that state should live.';
    return;
  }
  if (held && (!last || last.card !== held)) {
    fb.innerHTML = `<span class="what">where does this live?</span><b>${card(held).text}</b><br><br><span class="small">click where it lives</span>`;
    return;
  }
  const c = card(last.card), best = PLACES[RI[c.best]].short;
  const what = `<span class="what">${c.text}</span>`;
  if (last.kind === 'ok') fb.innerHTML = `<span class="v ok">✓ right: ${best}</span>${what}${c.reason}`;
  else if (last.kind === 'also') fb.innerHTML = `<span class="v also">also ok: ${PLACES[RI[last.place]].short}</span>${what}best answer: <b>${best}</b>. ${c.reason}`;
  else if (last.kind === 'miss') {
    // which way to go is a nudge, not the answer
    const dir = RI[last.place] > RI[c.best] ? 'less machinery would do.' : 'this needs more than that.';
    fb.innerHTML = `<span class="v no">✗ not ${PLACES[RI[last.place]].short}</span>${what}${dir} ${c.hint}<br><span class="small">one more try</span>`;
  } else fb.innerHTML = `<span class="v no">✗ it goes in: ${best}</span>${what}${c.reason}`;
}

function render(popId) {
  drawCards();
  drawChips(popId);
  feedback();
  $('app').classList.toggle('holding', !!held);
  const n = CARDS.filter((c) => state[c.id].placed).length;
  $('score').innerHTML = `<b>${n} / ${CARDS.length}</b> placed`;
  $('takeaway').classList.toggle('hide', n < CARDS.length);
}

function flash(placeId, kind) {
  const row = document.querySelector(`.place[data-place="${placeId}"]`);
  row.classList.remove('f-ok', 'f-also', 'f-no'); void row.offsetWidth;
  row.classList.add('f-' + kind);
  setTimeout(() => row.classList.remove('f-' + kind), 900);
}

// --- the one rule of the game
function place(id, placeId) {
  const c = card(id), s = state[id];
  if (s.placed) return;
  held = null;
  if (placeId === c.best || c.ok.includes(placeId)) {
    s.placed = placeId;
    s.verdict = placeId === c.best ? 'ok' : 'also';
    last = { kind: s.verdict, card: id, place: placeId };
    render(id);
    flash(placeId, s.verdict);
    return;
  }
  s.misses++;
  flash(placeId, 'no');
  if (s.misses >= 2) {
    s.placed = c.best; s.verdict = 'no';
    last = { kind: 'answer', card: id, place: placeId };
    render(id);
    return;
  }
  last = { kind: 'miss', card: id, place: placeId };
  render();
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el.classList.add('shake');
}

// --- input: click-click works everywhere; dragging is a bonus
let press = null; // { id, x, y, dragging }
// divide by the board's scale so the ghost lands under your finger when the board is shrunk to fit a phone
const appXY = (e) => { const r = $('app').getBoundingClientRect(), k = r.width / 900; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; };
const placeAt = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest('.place'); };

$('pile').addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.card');
  if (!el || el.classList.contains('gone')) return;
  press = { id: el.dataset.id, x: e.clientX, y: e.clientY, dragging: false };
});
window.addEventListener('pointermove', (e) => {
  if (!press) return;
  if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) {
    press.dragging = true;
    if (held !== press.id) { held = press.id; render(); }
    const g = document.createElement('div');
    g.id = 'ghost'; g.className = 'card';
    g.innerHTML = `<span>${card(press.id).text}</span>`;
    const svg = makeSvg(g, 168, 58);
    svg.appendChild(rough.svg(svg).rectangle(2, 2, 164, 54, { stroke: '#6d28d9', strokeWidth: 3, roughness: 1.1, seed: 99 }));
    $('app').appendChild(g);
    document.querySelector(`.card[data-id="${press.id}"]`).classList.add('dragging');
  }
  if (press.dragging) {
    const p = appXY(e);
    Object.assign($('ghost').style, { left: p.x - 84 + 'px', top: p.y - 29 + 'px' });
    document.querySelectorAll('.place').forEach((r) => r.classList.remove('over'));
    const r = placeAt(e);
    if (r) r.classList.add('over');
  }
});
window.addEventListener('pointerup', (e) => {
  if (!press) return;
  const p = press; press = null;
  if (p.dragging) {
    $('ghost').remove();
    document.querySelectorAll('.place').forEach((r) => r.classList.remove('over'));
    const r = placeAt(e);
    if (r) place(p.id, r.dataset.place);
    else render(); // dropped nowhere: it stays in your hand
    return;
  }
  held = held === p.id ? null : p.id; // plain click: pick up, or put back
  if (held && last && last.card !== held) last = null; // keep the hint if you pick the same card back up
  render();
});

$('ladder').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip && !held) { // tap a placed chip to hear its reason again
    const s = state[chip.dataset.id];
    last = { kind: s.verdict === 'no' ? 'answer' : s.verdict, card: chip.dataset.id, place: s.placed };
    render();
    return;
  }
  const row = e.target.closest('.place');
  if (!row) return;
  if (!held) { $('fb').innerHTML = '<span class="small">pick up a card first, then click where it lives.</span>'; return; }
  place(held, row.dataset.place);
});

$('reset').addEventListener('click', newGame);

// opened straight from the QR code instead of inside a slide: shrink the 900x600 board to fit the screen
if (window.top === window) {
  const hint = document.createElement('div');
  hint.textContent = 'turn your phone sideways for a bigger board';
  Object.assign(hint.style, { position: 'fixed', left: '0', right: '0', textAlign: 'center', fontSize: '15px', color: '#6b7280' });
  document.body.appendChild(hint);
  const fit = () => {
    const k = Math.min(innerWidth / 900, innerHeight / 600, 1);
    Object.assign($('app').style, { transform: `scale(${k})`, transformOrigin: 'top left', margin: '0' });
    hint.style.top = 600 * k + 16 + 'px';
    hint.style.display = innerHeight > innerWidth ? 'block' : 'none';
  };
  addEventListener('resize', fit);
  fit();
}
newGame();
</script>
</body>
</html>
