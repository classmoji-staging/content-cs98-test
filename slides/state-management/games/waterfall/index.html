<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fetch in components vs route loaders</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; font-family: 'Comic Neue', cursive; color: #2b2f36; }
  #app { width: 900px; height: 600px; position: relative; margin: 0 auto; overflow: hidden; }
  .bar { display: flex; gap: 7px; justify-content: center; align-items: center; padding-top: 8px; height: 52px; box-sizing: border-box; }
  button.ui { font: 700 17px 'Comic Neue', cursive; border-radius: 12px; padding: 5px 12px; cursor: pointer; border: 2.5px solid #d1d5db; background: #fff; color: #4b5563; white-space: nowrap; }
  button.ui.on { border-color: #15803d; background: #e7f6ec; color: #15803d; }
  button.ui:disabled { opacity: .45; cursor: default; }
  .sep { width: 10px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; }

  /* the browser: address bar + the page */
  .tag { position: absolute; font-size: 14px; }
  #url { position: absolute; left: 44px; top: 82px; font: 13px ui-monospace, Menlo, monospace; color: #374151; }
  #go { position: absolute; left: 280px; top: 77px; font: 700 15px 'Comic Neue', cursive; padding: 2px 10px; border-radius: 10px; }
  #page { position: absolute; left: 36px; top: 116px; width: 312px; height: 228px; overflow: hidden; }
  #progress { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #1d4ed8; border-radius: 2px; }
  .blank { height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #9ca3af; font-size: 16px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 8px; border-bottom: 2px solid #e5e7eb; font-size: 16px; }
  .hdr b { color: #6d28d9; font-size: 18px; }
  .cols { display: flex; gap: 10px; padding: 8px 4px 0; }
  .list { width: 108px; font-size: 15px; line-height: 22px; }
  .list .t, .detail .t { font-size: 13px; color: #9ca3af; }
  .list .sel { background: #ede9fe; border-radius: 5px; padding: 0 4px; margin: 0 -4px; font-weight: 700; }
  .detail { flex: 1; font-size: 15px; line-height: 22px; border-left: 2px solid #e5e7eb; padding-left: 10px; min-height: 150px; }
  .detail .big { font: 700 24px 'Comic Neue', cursive; color: #1f2937; }
  .slot { display: flex; align-items: center; justify-content: center; min-height: 140px; }
  .spin { width: 13px; height: 13px; border: 2.5px solid #c7d2fe; border-top-color: #1d4ed8; border-radius: 50%; animation: turn .8s linear infinite; display: inline-block; }
  .spin.big { width: 24px; height: 24px; border-width: 4px; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .in { animation: fadein .35s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* the timeline */
  #clock { position: absolute; left: 388px; top: 76px; font: 700 15px ui-monospace, Menlo, monospace; color: #1d4ed8; }
  .tick { position: absolute; top: 80px; font: 12px ui-monospace, Menlo, monospace; color: #9ca3af; transform: translateX(-50%); }
  .rowlbl { position: absolute; left: 388px; width: 166px; font-size: 14px; line-height: 16px; color: #374151; }
  .rowlbl code { font-size: 12px; color: #6b7280; }
  .seg { position: absolute; height: 18px; width: 0; }
  .seg.net { background: #dbeafe; }
  .seg.work { border-radius: 3px; }
  .seg.c0 { background: #6d28d9; } .seg.c1 { background: #b45309; } .seg.c2 { background: #15803d; }
  #now { position: absolute; top: 100px; width: 2px; height: 192px; background: #1d4ed8; opacity: .5; display: none; }
  .mark { position: absolute; top: 268px; font-size: 13px; white-space: nowrap; color: #4b5563; }
  .mark i { position: absolute; left: -1px; top: -10px; width: 3px; height: 10px; background: #4b5563; }
  .mark.done { color: #15803d; font-weight: 700; } .mark.done i { background: #15803d; }
  #legend { position: absolute; left: 560px; top: 296px; font-size: 13px; color: #6b7280; display: flex; gap: 14px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
  #score { position: absolute; left: 388px; top: 318px; width: 480px; font-size: 15px; }
  #score div { white-space: nowrap; }

  #explain { position: absolute; left: 30px; top: 366px; width: 850px; font: 16px/1.3 'Comic Neue', cursive; }
  #prompt { font-size: 18px; margin-bottom: 6px; }
  .ans { margin-bottom: 3px; }
  .ans .q { font-size: 20px; font-weight: 700; color: #9ca3af; line-height: 1; }
  .red { color: #be123c; font-weight: 700; }
  .green { color: #15803d; font-weight: 700; }

  #code { position: absolute; left: 16px; top: 466px; width: 870px; height: 98px; display: flex; align-items: center; padding: 0 18px; box-sizing: border-box; }
  #code pre { margin: 0; font: 13px/1.32 ui-monospace, Menlo, monospace; color: #1f2937; }
  #code .k { color: #6d28d9; }
  #code .f { color: #1d4ed8; }
  #code .c { color: #9ca3af; }
  #takeaway { position: absolute; left: 0; width: 900px; top: 572px; text-align: center; font: 16px 'Comic Neue', cursive; color: #4b5563; }
  svg { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="ui mode" data-mode="comp" type="button">fetch in components</button>
    <button class="ui mode" data-mode="route" type="button">route loaders</button>
    <span class="sep"></span>
    <button class="ui" id="reset" type="button">reset</button>
  </div>

  <div class="tag" style="left:298px; top:330px; color:#1d4ed8">browser</div>
  <div id="url">/sales/invoices/102</div>
  <button class="ui" id="go" type="button">open ↵</button>
  <div id="page"></div>

  <div id="clock"></div>
  <div id="ticks"></div>
  <div id="rows"></div>
  <div id="now"></div>
  <div id="marks"></div>
  <div id="legend">
    <span><i style="background:#dbeafe"></i>on the network</span>
    <span><i style="background:linear-gradient(90deg,#6d28d9 33%,#b45309 33% 66%,#15803d 66%)"></i>server working</span>
  </div>
  <div id="score"></div>

  <div id="explain">
    <div id="prompt"></div>
    <div class="ans" id="ans-comp"></div>
    <div class="ans" id="ans-route"></div>
  </div>
  <div id="code"><pre id="src"></pre></div>
  <div id="takeaway"></div>
</div>
<script>
// One page, /sales/invoices/102, made of three nested routes that each need data: root (the user),
// sales (the invoice list) and invoice (one invoice). "comp" fetches in each component's useEffect, so
// a child can't start until its parent has its data and renders it: a waterfall. "route" lets the
// router match the URL first and run all three loaders at once, in one request. Nothing is fetched;
// it's a clock and a schedule. Times are pretend ms, played back 1.6x slower so you can follow it.
const NET = 100, RENDER = 80, SLOW = 1.6, MAX = 2400;
const WORK = [300, 600, 400]; // how long the server takes for user, invoices, invoice
const X0 = 566, PX = 290 / MAX; // timeline x for t = 0, px per ms
const ROW_Y = [112, 158, 204];
const LABEL = {
  comp: ['<b>&lt;Root&gt;</b> fetches<br><code>/api/user</code>', '<b>&lt;Sales&gt;</b> fetches<br><code>/api/invoices</code>', '<b>&lt;Invoice&gt;</b> fetches<br><code>/api/invoices/102</code>'],
  route: ['<b>root</b> loader<br><code>getUser()</code>', '<b>sales</b> loader<br><code>getInvoices()</code>', '<b>invoice</b> loader<br><code>getInvoice(102)</code>'],
};
const CODE = {
  comp: `<span class="k">function</span> <span class="f">Sales</span>() {
  <span class="k">const</span> [invoices, setInvoices] = <span class="f">useState</span>(<span class="k">null</span>)
  <span class="f">useEffect</span>(() => { <span class="f">getInvoices</span>().<span class="f">then</span>(setInvoices) }, [])
  <span class="k">if</span> (!invoices) <span class="k">return</span> &lt;Spinner /&gt;  <span class="c">// &lt;Invoice&gt; isn't rendered yet, so its fetch can't even start</span>
  <span class="k">return</span> &lt;&gt;&lt;List invoices={invoices} /&gt;&lt;Invoice id={102} /&gt;&lt;/&gt;
}`,
  route: `<span class="c">// routes/sales.jsx</span>                               <span class="c">// routes/sales.invoice.jsx</span>
<span class="k">export async function</span> <span class="f">loader</span>() {                  <span class="k">export async function</span> <span class="f">loader</span>({ params }) {
  <span class="k">return</span> { invoices: <span class="k">await</span> <span class="f">getInvoices</span>() }          <span class="k">return</span> { invoice: <span class="k">await</span> <span class="f">getInvoice</span>(params.id) }
}                                                 }
<span class="c">// /sales/invoices/102 matches root + sales + invoice, so the router knows all three loaders up front</span>`,
};

// the schedule for each mode: bar segments per row, and what the page shows when
function plan(mode) {
  const rows = [], marks = [];
  if (mode === 'comp') {
    let t = 0;
    marks.push({ at: 0, show: 0, text: 'spinner' });
    WORK.forEach((w, i) => {
      rows.push([{ from: t, to: t + NET, k: 'net' }, { from: t + NET, to: t + NET + w, k: 'work' }, { from: t + NET + w, to: t + 2 * NET + w, k: 'net' }]);
      t += 2 * NET + w + RENDER;
      marks.push({ at: t, show: i + 1, text: ['header', 'list', 'invoice ✓'][i] });
    });
  } else {
    const last = NET + Math.max(...WORK);
    WORK.forEach((w) => rows.push([{ from: 0, to: NET, k: 'net' }, { from: NET, to: NET + w, k: 'work' }, { from: last, to: last + NET, k: 'net' }]));
    marks.push({ at: 0, show: 'wait', text: 'blank' });
    marks.push({ at: last + NET + RENDER, show: 3, text: 'everything ✓' });
  }
  return { rows, marks, end: marks[marks.length - 1].at };
}

let mode, run, results, timers;
const $ = (id) => document.getElementById(id);

// what the page looks like at each stage: 0 nothing yet, 1 header, 2 + list, 3 + invoice
function page(show) {
  const spin = '<div class="slot"><span class="spin big"></span></div>';
  if (show === 'idle') return '<div class="blank">(new tab)<span style="font-size:14px">click <b>open</b> to load the page</span></div>';
  if (show === 'wait') return '<div id="progress"></div><div class="blank"><span class="spin"></span>waiting for the server…</div>';
  if (show === 0) return '<div class="blank"><span class="spin big"></span></div>';
  const hdr = `<div class="hdr${show === 1 ? ' in' : ''}"><b>acme</b><span>hi, Sam 👋</span></div>`;
  if (show === 1) return hdr + spin;
  const list = `<div class="list${show === 2 ? ' in' : ''}"><div class="t">invoices</div><div>#101 $120</div><div class="sel">#102 $860</div><div>#103 $45</div><div>#104 $310</div></div>`;
  const detail = show === 2 ? `<div class="detail">${spin}</div>`
    : `<div class="detail in"><div class="t">invoice</div><div class="big">#102</div><div>Moose Feed Co.</div><div>$860 · due Nov 1</div><div>not paid yet</div></div>`;
  return hdr + `<div class="cols">${list}${detail}</div>`;
}

function drawRows() {
  const p = plan(mode);
  $('rows').innerHTML = LABEL[mode].map((l, i) => `<div class="rowlbl" style="top:${ROW_Y[i] - 2}px">${l}</div>`).join('') +
    p.rows.map((segs, i) => segs.map((s) =>
      `<div class="seg ${s.k}${s.k === 'work' ? ' c' + i : ''}" data-from="${s.from}" data-to="${s.to}" style="left:${X0 + s.from * PX}px; top:${ROW_Y[i]}px"></div>`).join('')).join('');
  $('marks').innerHTML = '';
}

// move the clock to t (pretend ms): grow the bars, drop marks, update the page
function at(t) {
  document.querySelectorAll('.seg').forEach((el) => {
    const from = +el.dataset.from, to = +el.dataset.to;
    el.style.width = Math.max(0, Math.min(t, to) - from) * PX + 'px';
  });
  $('now').style.display = 'block';
  $('now').style.left = (X0 + Math.min(t, MAX) * PX) + 'px';
  $('clock').textContent = 't = ' + (t / 1000).toFixed(2) + 's';
  const shown = run.plan.marks.filter((m) => m.at <= t);
  if (shown.length !== run.marks) {
    run.marks = shown.length;
    const m = shown[shown.length - 1];
    $('page').innerHTML = page(m.show);
    $('marks').innerHTML = shown.map((m, i) =>
      `<div class="mark${i === run.plan.marks.length - 1 ? ' done' : ''}" style="left:${X0 + m.at * PX}px"><i></i>${m.text}</div>`).join('');
    // in comp mode marks sit closer together; stagger their labels so they don't collide
    document.querySelectorAll('.mark').forEach((el, i) => { if (mode === 'comp' && i % 2) el.style.top = '284px'; });
  }
  const bar = $('progress');
  if (bar) bar.style.width = Math.min(95, t / 9) + '%';
}

function tick() {
  const t = (performance.now() - run.t0) / SLOW;
  if (t >= run.plan.end) { at(run.plan.end); finish(); return; }
  at(t);
  run.raf = requestAnimationFrame(tick);
}

function start() {
  if (run && run.raf) return;
  drawRows();
  run = { plan: plan(mode), t0: performance.now(), marks: -1, raf: 0 };
  render();
  run.raf = requestAnimationFrame(tick);
}

function finish() {
  run.raf = 0;
  const spinners = run.plan.marks.filter((m) => m.show !== 3 && m.show !== 'wait').length;
  results[mode] = { ms: run.plan.end, spinners };
  render();
}

function render() {
  const busy = !!(run && run.raf);
  document.querySelectorAll('.mode').forEach((b) => { b.classList.toggle('on', b.dataset.mode === mode); b.disabled = busy; });
  $('go').disabled = busy;
  $('src').innerHTML = CODE[mode];

  const r = results;
  const line = (k, name) => r[k] ? `<div><b>${name}:</b> on screen at <b>${(r[k].ms / 1000).toFixed(2)}s</b>, ${r[k].spinners ? r[k].spinners + ' spinners' : 'no spinners'}</div>` : '';
  $('score').innerHTML = line('comp', 'fetch in components') + line('route', 'route loaders');

  if (r.comp && r.route) $('prompt').innerHTML = 'same server, same three requests. <b>what made the difference?</b>';
  else if (r.comp || r.route) $('prompt').innerHTML = 'now switch modes and click <b>open</b> again. <b>which is on screen first?</b>';
  else $('prompt').innerHTML = 'click <b>open</b> in each mode and watch the timeline. <b>which is on screen first, and why?</b>';
  const q = '<span class="q">?</span>';
  $('ans-comp').innerHTML = '<b>fetch in components:</b> ' + (r.comp
    ? 'each child starts fetching only after its parent renders. <span class="red">a waterfall</span>, with a spinner at every level.' : q);
  $('ans-route').innerHTML = '<b>route loaders:</b> ' + (r.route
    ? 'the router matched the URL first, so all three loaders <span class="green">ran at once</span>, in one request.' : q);
  $('takeaway').innerHTML = r.comp && r.route
    ? '<b>the URL already says what the page needs,</b> so fetch at the route, before anything renders.' : '';
}

function reset() {
  if (run && run.raf) cancelAnimationFrame(run.raf);
  run = null; mode = 'comp'; results = {};
  $('page').innerHTML = page('idle');
  $('now').style.display = 'none';
  $('clock').textContent = 't = 0.00s';
  drawRows();
  render();
}

document.querySelectorAll('.mode').forEach((b) => b.addEventListener('click', () => {
  if (run && run.raf) return;
  mode = b.dataset.mode;
  run = null;
  $('page').innerHTML = page('idle');
  $('now').style.display = 'none';
  $('clock').textContent = 't = 0.00s';
  drawRows();
  render();
}));
$('go').addEventListener('click', start);
$('reset').addEventListener('click', reset);

// time axis ticks every 0.5s
$('ticks').innerHTML = [0, 500, 1000, 1500, 2000].map((t) => `<div class="tick" style="left:${X0 + t * PX}px">${t / 1000}s</div>`).join('');

// static hand-drawn pieces: browser box + address bar, timeline box, row guides, code strip
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('width', 900); svg.setAttribute('height', 600);
$('app').appendChild(svg);
const rc = rough.svg(svg, { options: { roughness: 1.2, strokeWidth: 2.4 } });
svg.appendChild(rc.rectangle(24, 68, 336, 286, { stroke: '#1d4ed8', seed: 3 }));
svg.appendChild(rc.rectangle(36, 76, 236, 28, { stroke: '#9ca3af', strokeWidth: 1.6, roughness: 0.8, seed: 4 }));
svg.appendChild(rc.rectangle(372, 68, 504, 286, { stroke: '#4b5563', strokeWidth: 1.8, seed: 5 }));
ROW_Y.forEach((y, i) => svg.appendChild(rc.line(X0, y + 9, X0 + MAX * PX, y + 9, { stroke: '#e5e7eb', strokeWidth: 1.2, roughness: 0.6, seed: 6 + i })));
svg.appendChild(rc.line(388, 254, 860, 254, { stroke: '#d1d5db', strokeWidth: 1.4, roughness: 0.6, seed: 9 }));
svg.appendChild(rc.rectangle(16, 466, 870, 98, { stroke: '#4b5563', strokeWidth: 1.8, seed: 19 }));
// "on screen" label for the marks row
const os = document.createElement('div');
os.className = 'rowlbl'; os.style.top = '262px'; os.innerHTML = '<b>on screen</b>';
$('app').appendChild(os);

reset();
</script>
</body>
</html>
